name: kapda_junction
description: "Kapda Junction - Men's Wear Fashion E-commerce App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5

  # Navigation
  go_router: ^14.8.1

  # HTTP
  dio: ^5.8.0+1
  pretty_dio_logger: ^1.4.0

  # Local Storage
  shared_preferences: ^2.5.3
  hive_flutter: ^1.1.0

  # Dependency Injection
  get_it: ^8.0.3

  # Payment
  razorpay_flutter: ^1.3.7

  # Images
  cached_network_image: ^3.4.1

  # UI
  carousel_slider: ^5.0.0
  shimmer: ^3.0.0

  # Utils
  intl: ^0.20.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.4
  logger: ^2.5.0
  dartz: ^0.10.1
  image_picker: ^1.1.2
  flutter_html: ^3.0.0
  # Required for <table> in Html() — core flutter_html does not render tables alone.
  flutter_html_table: ^3.0.0

  # Firebase / Push Notifications
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  # Full-bleed icon (used as legacy icon and iOS icon)
  image_path: "assets/images/kapda_junction_logo.png"
  # Android adaptive icon — logo on brand navy background
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/images/kapda_junction_logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
