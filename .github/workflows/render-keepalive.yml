name: Render Keep Alive

on:
  schedule:
    # Every 15 minutes. Adjust if you want more/less frequent pings.
    - cron: "*/15 * * * *"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        run: >
          curl -fsS --max-time 10
          https://kapda-junction-api.onrender.com/api/health
          > /dev/null

